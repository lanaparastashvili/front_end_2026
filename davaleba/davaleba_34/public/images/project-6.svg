<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EE1A0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#agbg)"/>

  <!-- Left / Hero Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="40" fill="#4EE1A0" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3">FRONT-END CHALLENGE</text>
    <text x="0" y="90" fill="#ffffff" font-family="sans-serif" font-size="40" font-weight="900">Age Calculator</text>
    <text x="0" y="125" fill="#9ca3af" font-family="sans-serif" font-size="16">Calculate your exact age in</text>
    <text x="0" y="147" fill="#9ca3af" font-family="sans-serif" font-size="16">years, months and days</text>

    <!-- Input form -->
    <g transform="translate(0, 175)">
      <!-- Day -->
      <text x="0" y="0" fill="#9ca3af" font-family="sans-serif" font-size="12" letter-spacing="3">DAY</text>
      <rect x="0" y="8" width="80" height="50" rx="8" fill="#1a1a1a" stroke="#4EE1A0" stroke-width="1.5"/>
      <text x="40" y="38" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">14</text>

      <!-- Month -->
      <text x="100" y="0" fill="#9ca3af" font-family="sans-serif" font-size="12" letter-spacing="3">MONTH</text>
      <rect x="100" y="8" width="80" height="50" rx="8" fill="#1a1a1a" stroke="#3f3f46" stroke-width="1"/>
      <text x="140" y="38" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">03</text>

      <!-- Year -->
      <text x="200" y="0" fill="#9ca3af" font-family="sans-serif" font-size="12" letter-spacing="3">YEAR</text>
      <rect x="200" y="8" width="100" height="50" rx="8" fill="#1a1a1a" stroke="#3f3f46" stroke-width="1"/>
      <text x="250" y="38" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">2003</text>

      <!-- Divider line with arrow button -->
      <line x1="0" y1="85" x2="310" y2="85" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="310" cy="85" r="32" fill="url(#accent-badge)"/>
      <text x="310" y="93" fill="#000000" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">↓</text>
    </g>

    <!-- Results -->
    <g transform="translate(0, 330)">
      <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="40" font-weight="900">
        <tspan fill="#4EE1A0">21</tspan> years
      </text>
      <text x="0" y="48" fill="#ffffff" font-family="sans-serif" font-size="40" font-weight="900">
        <tspan fill="#4EE1A0">05</tspan> months
      </text>
      <text x="0" y="96" fill="#ffffff" font-family="sans-serif" font-size="40" font-weight="900">
        <tspan fill="#4EE1A0">12</tspan> days
      </text>
    </g>
  </g>

  <!-- Right decorative circle motif -->
  <g transform="translate(520, 60)">
    <circle cx="140" cy="140" r="140" fill="none" stroke="#1f1f1f" stroke-width="50"/>
    <circle cx="140" cy="140" r="90" fill="none" stroke="#4EE1A0" stroke-width="3" stroke-dasharray="12 6" opacity="0.3"/>
    <circle cx="140" cy="140" r="50" fill="#1a1a1a" stroke="#4EE1A0" stroke-width="2"/>
    <text x="140" y="148" fill="#4EE1A0" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle">21</text>
    <text x="140" y="220" fill="#9ca3af" font-family="sans-serif" font-size="15" text-anchor="middle">years old</text>
  </g>
</svg>
