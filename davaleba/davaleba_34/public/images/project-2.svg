<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tvbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#tvbg)"/>

  <!-- Top Nav Bar -->
  <rect x="0" y="0" width="800" height="56" fill="#111827"/>
  <text x="36" y="36" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">TV<tspan fill="#4EE1A0">Maze</tspan></text>
  <!-- Search bar -->
  <rect x="200" y="14" width="380" height="30" rx="15" fill="#374151" stroke="#4EE1A0" stroke-width="1"/>
  <text x="230" y="33" fill="#9ca3af" font-family="sans-serif" font-size="13">🔍  Search TV shows...</text>

  <!-- Featured Show Banner -->
  <rect x="36" y="72" width="728" height="180" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="36" y="72" width="280" height="180" rx="12" fill="#374151"/>
  <rect x="56" y="90" width="240" height="140" rx="8" fill="#6b7280"/>
  <text x="176" y="167" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">▶ FEATURED</text>
  <text x="340" y="112" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Breaking Bad</text>
  <text x="340" y="136" fill="#4EE1A0" font-family="sans-serif" font-size="13" font-weight="bold">⭐ 9.5 / 10  •  Drama / Crime</text>
  <text x="340" y="162" fill="#9ca3af" font-family="sans-serif" font-size="13">A chemistry teacher turned drug</text>
  <text x="340" y="180" fill="#9ca3af" font-family="sans-serif" font-size="13">manufacturer after a diagnosis.</text>
  <rect x="340" y="210" width="110" height="30" rx="15" fill="#4EE1A0"/>
  <text x="395" y="229" fill="#111827" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">View Details</text>

  <!-- Show Cards Row -->
  <text x="36" y="286" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Popular Shows</text>
  <!-- Card 1 -->
  <rect x="36" y="298" width="140" height="175" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="36" y="298" width="140" height="110" rx="10" fill="#4b5563"/>
  <text x="106" y="358" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Stranger Things</text>
  <text x="106" y="374" fill="#4EE1A0" font-family="sans-serif" font-size="11" text-anchor="middle">⭐ 8.7</text>
  <text x="106" y="390" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Sci-Fi / Horror</text>
  <text x="106" y="405" fill="#6b7280" font-family="sans-serif" font-size="10" text-anchor="middle">4 Seasons</text>
  <!-- Card 2 -->
  <rect x="192" y="298" width="140" height="175" rx="10" fill="#1f2937" stroke="#4EE1A0" stroke-width="1.5"/>
  <rect x="192" y="298" width="140" height="110" rx="10" fill="#374151"/>
  <text x="262" y="358" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">The Last of Us</text>
  <text x="262" y="374" fill="#4EE1A0" font-family="sans-serif" font-size="11" text-anchor="middle">⭐ 9.0</text>
  <text x="262" y="390" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Drama / Thriller</text>
  <text x="262" y="405" fill="#6b7280" font-family="sans-serif" font-size="10" text-anchor="middle">2 Seasons</text>
  <!-- Card 3 -->
  <rect x="348" y="298" width="140" height="175" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="348" y="298" width="140" height="110" rx="10" fill="#6b7280"/>
  <text x="418" y="358" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">House of Dragon</text>
  <text x="418" y="374" fill="#4EE1A0" font-family="sans-serif" font-size="11" text-anchor="middle">⭐ 8.4</text>
  <text x="418" y="390" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Fantasy / Drama</text>
  <text x="418" y="405" fill="#6b7280" font-family="sans-serif" font-size="10" text-anchor="middle">2 Seasons</text>
  <!-- Card 4 -->
  <rect x="504" y="298" width="140" height="175" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="504" y="298" width="140" height="110" rx="10" fill="#4b5563"/>
  <text x="574" y="358" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Wednesday</text>
  <text x="574" y="374" fill="#4EE1A0" font-family="sans-serif" font-size="11" text-anchor="middle">⭐ 8.1</text>
  <text x="574" y="390" fill="#9ca3af" font-family="sans-serif" font-size="10" text-anchor="middle">Comedy / Horror</text>
  <text x="574" y="405" fill="#6b7280" font-family="sans-serif" font-size="10" text-anchor="middle">1 Season</text>
</svg>
