<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="weather-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#weather-bg)"/>

  <!-- Weather App Glass Card -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="20" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="2"/>
    
    <!-- Top Search & City Header -->
    <text x="50" y="70" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">London</text>
    <text x="50" y="100" fill="#94a3b8" font-family="sans-serif" font-size="16">11:28 - Saturday, 22 Aug '26</text>
    <rect x="420" y="45" width="210" height="40" rx="20" fill="#0f172a" stroke="#4EE1A0" stroke-width="1"/>
    <text x="450" y="70" fill="#4EE1A0" font-family="sans-serif" font-size="14">🔍 Search Location...</text>

    <!-- Main Temperature & Graphic -->
    <text x="50" y="210" fill="#ffffff" font-family="sans-serif" font-size="96" font-weight="900">16°</text>
    <text x="210" y="180" fill="#4EE1A0" font-family="sans-serif" font-size="22" font-weight="bold">PARTLY CLOUDY</text>
    <text x="210" y="205" fill="#94a3b8" font-family="sans-serif" font-size="15">Humidity: 68% • Wind: 14 km/h</text>

    <!-- Sun & Cloud illustration -->
    <g transform="translate(480, 110)">
      <circle cx="90" cy="50" r="45" fill="url(#sun-grad)" filter="drop-shadow(0 0 20px rgba(251, 191, 36, 0.4))"/>
      <path d="M 40 90 A 30 30 0 0 1 90 70 A 40 40 0 0 1 155 80 A 30 30 0 0 1 180 110 A 30 30 0 0 1 150 140 L 40 140 A 25 25 0 0 1 40 90 Z" fill="url(#cloud-grad)"/>
    </g>

    <!-- 4 Day Forecast Row -->
    <g transform="translate(50, 270)">
      <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1">TODAY'S WEATHER FORECAST</text>
      
      <!-- Day 1 -->
      <g transform="translate(0, 20)">
        <rect width="130" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">12:00 PM</text>
        <circle cx="65" cy="55" r="12" fill="#fbbf24"/>
        <text x="65" y="85" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">17°C</text>
      </g>
      <!-- Day 2 -->
      <g transform="translate(150, 20)">
        <rect width="130" height="95" rx="12" fill="#0f172a" stroke="#4EE1A0" stroke-width="1.5"/>
        <text x="65" y="30" fill="#4EE1A0" font-family="sans-serif" font-size="13" text-anchor="middle">03:00 PM</text>
        <circle cx="65" cy="55" r="12" fill="#fbbf24"/>
        <text x="65" y="85" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">19°C</text>
      </g>
      <!-- Day 3 -->
      <g transform="translate(300, 20)">
        <rect width="130" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">06:00 PM</text>
        <circle cx="65" cy="55" r="12" fill="#94a3b8"/>
        <text x="65" y="85" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">15°C</text>
      </g>
      <!-- Day 4 -->
      <g transform="translate(450, 20)">
        <rect width="130" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="65" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">09:00 PM</text>
        <circle cx="65" cy="55" r="12" fill="#38bdf8"/>
        <text x="65" y="85" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">13°C</text>
      </g>
    </g>
  </g>
</svg>
