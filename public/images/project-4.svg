<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ccbg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d0f52"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c2bd9"/>
      <stop offset="100%" stop-color="#4EE1A0"/>
    </linearGradient>
    <linearGradient id="card-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ccbg)"/>

  <!-- Back of Card (slightly offset behind) -->
  <g transform="translate(30, 45) rotate(-4, 220, 140)">
    <rect width="350" height="195" rx="14" fill="url(#card-back-grad)" opacity="0.8"/>
    <!-- Magnetic stripe -->
    <rect x="0" y="55" width="350" height="50" fill="#1e1b4b"/>
    <!-- Signature strip -->
    <rect x="30" y="130" width="200" height="28" fill="#e2e8f0" rx="4"/>
    <!-- CVV -->
    <text x="340" y="148" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="end">265</text>
    <text x="340" y="168" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">CVV</text>
  </g>

  <!-- Front of Card -->
  <g transform="translate(50, 65)">
    <rect width="350" height="195" rx="14" fill="url(#card-grad)"/>
    <!-- Chip -->
    <rect x="25" y="30" width="45" height="35" rx="5" fill="#fbbf24"/>
    <rect x="32" y="37" width="31" height="21" rx="3" fill="#f59e0b"/>
    <line x1="48" y1="37" x2="48" y2="58" stroke="#d97706" stroke-width="1.5"/>
    <line x1="32" y1="48" x2="63" y2="48" stroke="#d97706" stroke-width="1.5"/>
    <!-- Visa / Network logo -->
    <text x="325" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="end" font-style="italic">VISA</text>
    <!-- Card Number -->
    <text x="25" y="125" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="3">1234  5678  9012  3456</text>
    <!-- Name & Expiry -->
    <text x="25" y="160" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" letter-spacing="1">CARD HOLDER</text>
    <text x="280" y="160" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" text-anchor="end" letter-spacing="1">EXPIRES</text>
    <text x="25" y="178" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">LANA PARASTASHVILI</text>
    <text x="280" y="178" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end">08 / 26</text>
  </g>

  <!-- Input Form Panel -->
  <g transform="translate(440, 50)">
    <rect width="320" height="390" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="160" y="45" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Complete your order</text>

    <!-- Card Number input -->
    <text x="25" y="78" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11" letter-spacing="1">CARD NUMBER</text>
    <rect x="25" y="86" width="270" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="40" y="109" fill="#ffffff" font-family="monospace" font-size="15">1234 5678 9012 3456</text>

    <!-- Holder Name input -->
    <text x="25" y="148" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11" letter-spacing="1">CARDHOLDER NAME</text>
    <rect x="25" y="156" width="270" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="#4EE1A0" stroke-width="1.5"/>
    <text x="40" y="179" fill="#ffffff" font-family="sans-serif" font-size="15">Lana Parastashvili</text>

    <!-- Expiry & CVV row -->
    <text x="25" y="218" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11" letter-spacing="1">EXP. DATE</text>
    <text x="175" y="218" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11" letter-spacing="1">CVV</text>
    <rect x="25" y="226" width="130" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="40" y="249" fill="#ffffff" font-family="monospace" font-size="15">08 / 26</text>
    <rect x="175" y="226" width="120" height="38" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="190" y="249" fill="#ffffff" font-family="monospace" font-size="15">e.g. 123</text>

    <!-- Confirm button -->
    <rect x="25" y="300" width="270" height="46" rx="23" fill="#4EE1A0"/>
    <text x="160" y="328" fill="#18181b" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CONFIRM ORDER</text>
  </g>
</svg>
