<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cmtbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#13131f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cmtbg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="58" fill="#16213e"/>
  <text x="36" y="36" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">💬 Discussion Board</text>
  <rect x="600" y="14" width="160" height="32" rx="16" fill="#4EE1A0"/>
  <text x="680" y="33" fill="#13131f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+ Add Comment</text>

  <!-- Comment 1 (main comment) -->
  <g transform="translate(36, 78)">
    <rect width="728" height="110" rx="12" fill="#252542" stroke="#3d3d6b" stroke-width="1"/>
    <!-- Avatar -->
    <circle cx="40" cy="40" r="22" fill="#4EE1A0"/>
    <text x="40" y="46" fill="#13131f" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LP</text>
    <!-- Content -->
    <text x="78" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">maxblagun</text>
    <text x="78" y="45" fill="#9ca3af" font-family="sans-serif" font-size="13">1 month ago</text>
    <text x="78" y="68" fill="#d1d5db" font-family="sans-serif" font-size="14">Impressive! Though it seems the drag feature could be improved.</text>
    <text x="78" y="88" fill="#d1d5db" font-family="sans-serif" font-size="14">The timing and interaction feel a bit clunky overall.</text>
    <!-- Actions -->
    <text x="78" y="100" fill="#4EE1A0" font-family="sans-serif" font-size="13" font-weight="bold">👍 12</text>
    <text x="140" y="100" fill="#9ca3af" font-family="sans-serif" font-size="13">Reply</text>
    <text x="670" y="35" fill="#9ca3af" font-family="sans-serif" font-size="13" text-anchor="end">Edit</text>
    <text x="715" y="35" fill="#ef4444" font-family="sans-serif" font-size="13">Delete</text>
  </g>

  <!-- Reply (indented) -->
  <g transform="translate(100, 208)">
    <rect width="664" height="100" rx="12" fill="#252542" stroke="#3d3d6b" stroke-width="1"/>
    <circle cx="36" cy="36" r="20" fill="#6366f1"/>
    <text x="36" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AM</text>
    <text x="70" y="24" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">amyrobson</text>
    <text x="70" y="41" fill="#9ca3af" font-family="sans-serif" font-size="13">2 weeks ago</text>
    <text x="70" y="63" fill="#d1d5db" font-family="sans-serif" font-size="14">@maxblagun I agree, but the overall design is still very clean.</text>
    <text x="70" y="88" fill="#4EE1A0" font-family="sans-serif" font-size="13" font-weight="bold">👍 5</text>
    <text x="120" y="88" fill="#9ca3af" font-family="sans-serif" font-size="13">Reply</text>
  </g>

  <!-- Comment 2 -->
  <g transform="translate(36, 328)">
    <rect width="728" height="100" rx="12" fill="#252542" stroke="#3d3d6b" stroke-width="1"/>
    <circle cx="40" cy="36" r="22" fill="#ec4899"/>
    <text x="40" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JW</text>
    <text x="78" y="24" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">juliusomo</text>
    <text x="78" y="41" fill="#9ca3af" font-family="sans-serif" font-size="13">3 weeks ago</text>
    <text x="78" y="62" fill="#d1d5db" font-family="sans-serif" font-size="14">Great quality, but the UI could use some refinement in mobile view.</text>
    <text x="78" y="88" fill="#4EE1A0" font-family="sans-serif" font-size="13" font-weight="bold">👍 8</text>
    <text x="120" y="88" fill="#9ca3af" font-family="sans-serif" font-size="13">Reply</text>
  </g>

  <!-- Add comment text area -->
  <g transform="translate(36, 445)">
    <circle cx="22" cy="22" r="20" fill="#4EE1A0"/>
    <text x="22" y="28" fill="#13131f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LP</text>
    <rect x="55" y="4" width="556" height="36" rx="8" fill="#252542" stroke="#3d3d6b" stroke-width="1"/>
    <text x="68" y="25" fill="#6b7280" font-family="sans-serif" font-size="14">Add a comment...</text>
    <rect x="630" y="4" width="90" height="36" rx="8" fill="#4EE1A0"/>
    <text x="675" y="26" fill="#13131f" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">POST</text>
  </g>
</svg>
