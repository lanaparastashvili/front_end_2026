<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EE1A0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Abstract Tech Portrait Representation -->
  <circle cx="220" cy="210" r="140" fill="#2d2d2d" stroke="#333333" stroke-width="2"/>
  <circle cx="220" cy="210" r="120" fill="#383838" />
  
  <!-- Head Silhouette / Character -->
  <circle cx="220" cy="180" r="60" fill="#e2e8f0" />
  <path d="M 140 330 C 140 255, 300 255, 300 330 Z" fill="#cbd5e1" />
  
  <!-- Code brackets graphic -->
  <path d="M 120 180 L 80 210 L 120 240" fill="none" stroke="#4EE1A0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 320 180 L 360 210 L 320 240" fill="none" stroke="#4EE1A0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Developer Glasses & Smile Accent -->
  <circle cx="200" cy="175" r="16" fill="none" stroke="#151515" stroke-width="4"/>
  <circle cx="240" cy="175" r="16" fill="none" stroke="#151515" stroke-width="4"/>
  <line x1="216" y1="175" x2="224" y2="175" stroke="#151515" stroke-width="4"/>
  <path d="M 205 210 Q 220 225 235 210" fill="none" stroke="#151515" stroke-width="4" stroke-linecap="round"/>

  <!-- Glowing Accent Tag -->
  <g transform="translate(130, 410)">
    <rect width="180" height="42" rx="21" fill="#151515" stroke="#4EE1A0" stroke-width="2"/>
    <text x="90" y="26" fill="#4EE1A0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">&lt;DEVELOPER /&gt;</text>
  </g>
</svg>
